name: Native shells
# Slow builds, so only when the shells or the web app change (or on demand).
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amcn/desktop exec tauri build --no-bundle

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # The API address a real build would point at; CI only proves the app compiles.
      - run: VITE_API_BASE_URL=https://api.example.invalid pnpm --filter @amcn/mobile sync
      - run: cd apps/mobile/android && ./gradlew assembleDebug --console=plain
